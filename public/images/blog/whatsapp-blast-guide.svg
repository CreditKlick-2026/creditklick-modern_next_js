<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="blastBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf4"/>
      <stop offset="100%" stop-color="#e5f5ec"/>
    </linearGradient>
    <linearGradient id="blastBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="waGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="blastShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="375" rx="16" fill="url(#blastBg)"/>

  <!-- Subtle grid lines/circles -->
  <circle cx="500" cy="50" r="90" fill="#25d366" fill-opacity="0.08"/>
  <circle cx="80" cy="300" r="110" fill="#156d47" fill-opacity="0.05"/>

  <!-- Left: Pills & Megaphone & Coins -->
  <g transform="translate(30, 40)">
    <!-- "How To Do" pill -->
    <g transform="translate(10, 10)">
      <rect width="105" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#blastShadow)"/>
      <path d="M 22 20 L 28 14 L 31 17 L 25 23 Z" fill="#475569"/>
      <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#334155">How To Do</text>
    </g>

    <!-- "WhatsApp Blast" big pill -->
    <g transform="translate(10, 52)">
      <rect width="185" height="46" rx="23" fill="url(#blastBtn)" filter="url(#blastShadow)"/>
      <text x="92" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">WhatsApp Blast</text>
    </g>

    <!-- Floating Gold Coins -->
    <g transform="translate(105, 5)">
      <ellipse cx="12" cy="12" rx="12" ry="10" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
      <ellipse cx="12" cy="12" rx="7" ry="5" fill="#fef08a"/>
      <ellipse cx="24" cy="22" rx="10" ry="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    </g>

    <!-- Megaphone Graphic -->
    <g transform="translate(30, 125)" filter="url(#blastShadow)">
      <rect width="70" height="70" rx="16" fill="#4ade80" fill-opacity="0.3"/>
      <!-- Megaphone path -->
      <path d="M 24 35 L 35 28 L 50 20 L 50 50 L 35 42 L 24 35 Z" fill="#16a34a"/>
      <rect x="18" y="32" width="8" height="12" rx="2" fill="#15803d"/>
      <path d="M 28 42 L 32 52 L 27 54 L 24 44 Z" fill="#15803d"/>
      <!-- Sound waves -->
      <path d="M 54 26 C 58 30 58 40 54 44" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 58 20 C 64 27 64 43 58 50" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right: Delivery Stats UI Window -->
  <g transform="translate(230, 35)" filter="url(#blastShadow)">
    <rect width="220" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <!-- Top Bar -->
    <rect width="220" height="26" rx="14" fill="#f8fafc"/>
    <rect y="16" width="220" height="10" fill="#f8fafc"/>
    <line x1="0" y1="26" x2="220" y2="26" stroke="#f1f5f9"/>
    <text x="110" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Broadcast Performance</text>

    <!-- Stats items -->
    <g transform="translate(14, 38)">
      <!-- Item 1 -->
      <circle cx="8" cy="8" r="7" fill="#dcfce7"/>
      <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e293b">78,262 <tspan font-size="11" font-weight="500" fill="#64748b">• 98% Sent</tspan></text>
      <text x="190" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">→</text>
      <line x1="0" y1="24" x2="192" y2="24" stroke="#f1f5f9"/>

      <!-- Item 2 -->
      <g transform="translate(0, 32)">
        <circle cx="8" cy="8" r="7" fill="#dcfce7"/>
        <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e293b">42,297 <tspan font-size="11" font-weight="500" fill="#64748b">• 94% Read</tspan></text>
        <text x="190" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">→</text>
        <line x1="0" y1="24" x2="192" y2="24" stroke="#f1f5f9"/>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 64)">
        <circle cx="8" cy="8" r="7" fill="#e0f2fe"/>
        <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e293b">13,025 <tspan font-size="11" font-weight="500" fill="#64748b">• 19% Replied</tspan></text>
        <text x="190" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">→</text>
        <line x1="0" y1="24" x2="192" y2="24" stroke="#f1f5f9"/>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 96)">
        <circle cx="8" cy="8" r="7" fill="#fef3c7"/>
        <path d="M 5 8 L 7 10 L 11 6" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1e293b">1,223 <tspan font-size="11" font-weight="500" fill="#64748b">• Shop Orders</tspan></text>
        <text x="190" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">→</text>
      </g>
    </g>

    <!-- Floating Top WA Badge -->
    <g transform="translate(195, -12)">
      <circle cx="16" cy="16" r="14" fill="url(#waGreen2)" filter="url(#blastShadow)"/>
      <path d="M 20 18 C 19.5 19 18.5 19.5 17.5 19.5 C 15 19.5 13 17.5 13 15 C 13 14 13.5 13 14.5 12.5 L 15.5 14.5 C 15.2 15 15.5 15.5 16 16 C 16.5 16.5 17 16.8 17.5 16.5 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Far Right / Bottom: Person with phone -->
  <g transform="translate(420, 140)">
    <defs>
      <clipPath id="circlePerson">
        <circle cx="90" cy="110" r="75"/>
      </clipPath>
    </defs>
    <g clip-path="url(#circlePerson)">
      <rect x="15" y="35" width="150" height="150" fill="#bbf7d0"/>
      <ellipse cx="90" cy="85" rx="35" ry="40" fill="#fed7aa"/>
      <path d="M 50 85 C 50 40 130 40 130 85 C 135 120 125 140 115 150 C 105 120 120 90 110 70 C 90 55 75 70 70 85 Z" fill="#451a03"/>
      <path d="M 35 160 Q 90 120 145 160 Z" fill="#15803d"/>
    </g>
    <circle cx="90" cy="110" r="75" fill="none" stroke="#22c55e" stroke-width="3"/>
  </g>
</svg>
