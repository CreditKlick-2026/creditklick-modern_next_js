<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="400" cy="220" r="180" fill="#2563eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="620" cy="140" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Speedometer Gauge Background Arc -->
  <path d="M 260 300 A 150 150 0 1 1 540 300" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" />

  <!-- Colored Speedometer Arc -->
  <path d="M 260 300 A 150 150 0 1 1 500 170" fill="none" stroke="url(#gaugeGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Gauge Tick Marks -->
  <circle cx="260" cy="300" r="4" fill="#94a3b8" />
  <circle cx="300" cy="190" r="4" fill="#94a3b8" />
  <circle cx="400" cy="150" r="4" fill="#94a3b8" />
  <circle cx="500" cy="190" r="4" fill="#94a3b8" />
  <circle cx="540" cy="300" r="4" fill="#94a3b8" />

  <!-- Central Score Display Card -->
  <rect x="310" y="195" width="180" height="135" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#cardShadow)" />
  <text x="400" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CIBIL SCORE</text>
  <text x="400" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">785</text>
  
  <!-- Status Badge -->
  <rect x="345" y="298" width="110" height="24" rx="12" fill="#10b981" opacity="0.2" />
  <text x="400" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">EXCELLENT</text>

  <!-- Speedometer Needle Center Pin -->
  <circle cx="400" cy="320" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />

  <!-- Left Floating Badge: +45 Pts Boost -->
  <g filter="url(#cardShadow)">
    <rect x="130" y="180" width="145" height="60" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="155" cy="210" r="14" fill="#3b82f6" opacity="0.2" />
    <path d="M 150 213 L 155 205 L 160 213" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="178" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">+45 Pts</text>
    <text x="178" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Score Increased</text>
  </g>

  <!-- Right Floating Badge: Approved Offers -->
  <g filter="url(#cardShadow)">
    <rect x="525" y="200" width="150" height="60" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="550" cy="230" r="14" fill="#10b981" opacity="0.2" />
    <path d="M 545 230 L 549 234 L 556 226" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="572" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Approved</text>
    <text x="572" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Pre-qualified Loans</text>
  </g>

  <!-- Bottom Brand Title Pill -->
  <g filter="url(#cardShadow)">
    <rect x="230" y="400" width="340" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="260" cy="425" r="12" fill="#2563eb" />
    <path d="M 255 425 L 265 425 M 260 420 L 260 430" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="282" y="431" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CreditKlick Credit Score Guide</text>
  </g>
</svg>
