<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="loanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="loanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#loanBg)" />

  <!-- Ambient Lights -->
  <circle cx="280" cy="220" r="150" fill="#3b82f6" opacity="0.18" filter="url(#loanGlow)" />
  <circle cx="520" cy="200" r="140" fill="#f59e0b" opacity="0.12" filter="url(#loanGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="320" x2="800" y2="320" />
  </g>

  <!-- Central Loan Disbursement Terminal Card -->
  <g transform="translate(220, 90)">
    <rect width="360" height="260" rx="20" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Top Pill: Instant Approval -->
    <rect x="25" y="25" width="130" height="28" rx="14" fill="#10b981" opacity="0.2" />
    <circle cx="40" cy="39" r="6" fill="#10b981" />
    <text x="54" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">PRE-APPROVED</text>

    <!-- Interest Rate Badge -->
    <g transform="translate(230, 20)">
      <rect width="105" height="40" rx="12" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
      <text x="52" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#fbbf24" text-anchor="middle">10.49%</text>
      <text x="52" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fde68a" text-anchor="middle">STARTING ROI</text>
    </g>

    <!-- Loan Amount Header -->
    <text x="25" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">MAX LOAN LIMIT</text>
    <text x="25" y="145" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff">₹ 25,00,000</text>

    <!-- Fast Perks Row -->
    <line x1="25" y1="170" x2="335" y2="170" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(25, 190)">
      <circle cx="12" cy="12" r="12" fill="#3b82f6" opacity="0.2" />
      <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#60a5fa" text-anchor="middle">⚡</text>
      <text x="32" y="11" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">24 Hr Disbursal</text>
      <text x="32" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Direct to Bank</text>
    </g>

    <g transform="translate(195, 190)">
      <circle cx="12" cy="12" r="12" fill="#10b981" opacity="0.2" />
      <text x="12" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">✓</text>
      <text x="32" y="11" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Minimal Docs</text>
      <text x="32" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">100% Digital</text>
    </g>
  </g>

  <!-- Left Floating Coin Stack -->
  <g transform="translate(90, 190)">
    <ellipse cx="40" cy="60" rx="30" ry="10" fill="url(#goldGrad)" />
    <ellipse cx="40" cy="50" rx="30" ry="10" fill="url(#goldGrad)" />
    <ellipse cx="40" cy="40" rx="30" ry="10" fill="url(#goldGrad)" />
    <ellipse cx="40" cy="30" rx="30" ry="10" fill="#fde68a" />
    <text x="40" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#92400e" text-anchor="middle">₹</text>
  </g>

  <!-- Right Floating EMI Calculator Badge -->
  <g transform="translate(600, 180)">
    <rect width="140" height="75" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="70" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Lowest EMI</text>
    <text x="70" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">₹ 1,899<tspan font-size="10" fill="#94a3b8">/Lakh</tspan></text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(230, 400)">
    <rect width="340" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#2563eb" />
    <path d="M 25 25 L 35 25 M 30 20 L 30 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="55" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Personal &amp; Home Loan Guide</text>
  </g>
</svg>
