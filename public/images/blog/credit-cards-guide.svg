<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="metallicBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="floatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cardBg)" />

  <!-- Ambient Glow -->
  <circle cx="360" cy="200" r="160" fill="#2563eb" opacity="0.2" filter="url(#floatGlow)" />
  <circle cx="500" cy="260" r="140" fill="#fbbf24" opacity="0.12" filter="url(#floatGlow)" />

  <!-- Back Card: Gold Platinum (Tilted) -->
  <g transform="translate(420, 190) rotate(12)">
    <rect x="-140" y="-85" width="280" height="170" rx="14" fill="url(#metallicGold)" stroke="#fef08a" stroke-width="1" opacity="0.9" />
    <rect x="-115" y="-55" width="34" height="26" rx="5" fill="url(#chipGrad)" />
    <!-- Contactless symbol -->
    <path d="M 90 -45 A 8 8 0 0 1 90 -25 M 98 -50 A 14 14 0 0 1 98 -20 M 106 -55 A 20 20 0 0 1 106 -15" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <text x="-115" y="45" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="3">•••• 8824</text>
    <text x="75" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fef08a">PLATINUM</text>
  </g>

  <!-- Front Card: Sapphire Blue Credit Card -->
  <g transform="translate(320, 210) rotate(-6)">
    <rect x="-150" y="-95" width="300" height="190" rx="16" fill="url(#metallicBlue)" stroke="#60a5fa" stroke-width="1.5" />
    
    <!-- Chip -->
    <rect x="-120" y="-60" width="38" height="30" rx="6" fill="url(#chipGrad)" />
    <line x1="-101" y1="-60" x2="-101" y2="-30" stroke="#a16207" stroke-width="1" />
    <line x1="-120" y1="-45" x2="-82" y2="-45" stroke="#a16207" stroke-width="1" />

    <!-- Contactless icon -->
    <path d="M 100 -50 A 9 9 0 0 1 100 -30 M 108 -55 A 15 15 0 0 1 108 -25 M 116 -60 A 21 21 0 0 1 116 -20" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />

    <!-- Card Brand & Number -->
    <text x="-120" y="25" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="3">4532 •••• •••• 9012</text>
    <text x="-120" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#93c5fd">CREDITKLICK ELITE</text>
    <text x="75" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">VISA</text>
  </g>

  <!-- Cashback Badge Top Left -->
  <g transform="translate(100, 110)">
    <rect width="140" height="60" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="70" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Unlimited Rewards</text>
    <text x="70" y="48" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle">5% Cashback</text>
  </g>

  <!-- Lifetime Free Badge Top Right -->
  <g transform="translate(560, 110)">
    <rect width="140" height="60" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="70" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Annual Fee</text>
    <text x="70" y="48" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#60a5fa" text-anchor="middle">LIFETIME FREE</text>
  </g>

  <!-- Bottom Title Pill -->
  <g transform="translate(230, 400)">
    <rect width="340" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#2563eb" />
    <path d="M 25 25 L 35 25 M 30 20 L 30 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="55" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Best Credit Cards Comparison Guide</text>
  </g>
</svg>
