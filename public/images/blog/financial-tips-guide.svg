<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182a" />
      <stop offset="50%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#09182a" />
    </linearGradient>
    <linearGradient id="finLineGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#finBg)" />

  <circle cx="300" cy="200" r="160" fill="#10b981" opacity="0.12" filter="url(#finGlow)" />
  <circle cx="550" cy="240" r="150" fill="#3b82f6" opacity="0.14" filter="url(#finGlow)" />

  <!-- Central Wealth Growth Chart & Metrics Card -->
  <g transform="translate(180, 80)">
    <rect width="440" height="280" rx="20" fill="#0f1d30" stroke="#1e3a5f" stroke-width="1.5" />

    <!-- Card Header -->
    <g transform="translate(30, 30)">
      <circle cx="16" cy="16" r="16" fill="#10b981" opacity="0.2" />
      <text x="16" y="21" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">💡</text>
      <text x="44" y="16" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Smart Wealth &amp; Debt Guide</text>
      <text x="44" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Proven Financial Strategies 2026</text>
    </g>

    <!-- Upward Trend Chart -->
    <path d="M 30 220 L 110 190 L 180 200 L 260 140 L 330 150 L 410 80 L 410 240 L 30 240 Z" fill="url(#finLineGrad)" />
    <path d="M 30 220 L 110 190 L 180 200 L 260 140 L 330 150 L 410 80" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

    <!-- Node Points -->
    <circle cx="110" cy="190" r="4" fill="#38bdf8" />
    <circle cx="260" cy="140" r="4" fill="#38bdf8" />
    <circle cx="410" cy="80" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />

    <!-- 3 Pillars on bottom of card -->
    <g transform="translate(30, 215)">
      <rect x="0" y="0" width="115" height="42" rx="8" fill="#172e48" />
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CREDIT UTILIZATION</text>
      <text x="12" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#34d399">&lt; 30% Ideal</text>

      <rect x="130" y="0" width="115" height="42" rx="8" fill="#172e48" />
      <text x="142" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">ON-TIME PAYMENTS</text>
      <text x="142" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">100% Track</text>

      <rect x="260" y="0" width="115" height="42" rx="8" fill="#172e48" />
      <text x="272" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8">CREDIT MIX</text>
      <text x="272" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#facc15">Balanced</text>
    </g>
  </g>

  <!-- Left Floating Badge: EMI Savings -->
  <g transform="translate(80, 210)">
    <rect width="160" height="65" rx="14" fill="#0b1726" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Annual Interest Saved</text>
    <text x="80" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle">₹ 48,000+</text>
  </g>

  <!-- Right Floating Badge: Debt Freedom -->
  <g transform="translate(560, 210)">
    <rect width="160" height="65" rx="14" fill="#0b1726" stroke="#3b82f6" stroke-width="1.5" />
    <text x="80" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Debt Snowball Strategy</text>
    <text x="80" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#60a5fa" text-anchor="middle">Debt-Free Sooner</text>
  </g>

  <!-- Bottom Title Pill -->
  <g transform="translate(230, 400)">
    <rect width="340" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#10b981" />
    <path d="M 25 25 L 35 25 M 30 20 L 30 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="55" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Smart Financial Planning Tips</text>
  </g>
</svg>
