<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cibilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#112240" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cibilBg)" />

  <!-- Ambient Light -->
  <circle cx="380" cy="200" r="160" fill="#0284c7" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="580" cy="280" r="130" fill="#3b82f6" opacity="0.12" filter="url(#softGlow)" />

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>

  <!-- Central Report Document Board -->
  <g transform="translate(180, 80)">
    <rect width="440" height="280" rx="16" fill="url(#docGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Doc Header Bar -->
    <rect x="24" y="24" width="160" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
    <rect x="24" y="44" width="100" height="8" rx="4" fill="#64748b" />
    
    <!-- Verification Status Seal -->
    <rect x="290" y="20" width="125" height="30" rx="15" fill="#10b981" opacity="0.2" />
    <circle cx="305" cy="35" r="7" fill="#10b981" />
    <path d="M 302 35 L 304 37 L 308 33" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="320" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">AUDIT PASSED</text>

    <!-- Chart Visual: Score 600 -> 780 -->
    <path d="M 40 220 C 120 200, 200 170, 280 130 C 340 100, 370 80, 400 70 L 400 240 L 40 240 Z" fill="url(#chartGrad)" />
    <path d="M 40 220 C 120 200, 200 170, 280 130 C 340 100, 370 80, 400 70" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Growth Node Points -->
    <circle cx="40" cy="220" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="40" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">600</text>

    <circle cx="280" cy="130" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <text x="280" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">710</text>

    <circle cx="400" cy="70" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <text x="375" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle">780+</text>
  </g>

  <!-- Left Feature Card: Dispute Resolution -->
  <g transform="translate(100, 260)">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#2563eb" opacity="0.2" />
    <path d="M 28 35 L 33 40 L 42 30" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="62" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Error Fix</text>
    <text x="62" y="49" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">CIBIL Rectification</text>
  </g>

  <!-- Right Feature Card: Credit Refine -->
  <g transform="translate(520, 260)">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#38bdf8" opacity="0.2" />
    <path d="M 35 25 L 35 45 M 25 35 L 45 35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <text x="62" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Credit Refine</text>
    <text x="62" y="49" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">100% Expert Support</text>
  </g>

  <!-- Bottom Title Pill -->
  <g transform="translate(230, 400)">
    <rect width="340" height="50" rx="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#0284c7" />
    <path d="M 25 25 L 35 25 M 30 20 L 30 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="55" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Credit Repair &amp; CIBIL Improvement</text>
  </g>
</svg>
