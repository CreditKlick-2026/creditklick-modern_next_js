<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f0f7f2"/>
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="600" cy="310" r="105"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="24" fill="url(#crmBg)"/>
  
  <!-- Decorative Background Elements -->
  <circle cx="120" cy="90" r="80" fill="#25d366" fill-opacity="0.06"/>
  <circle cx="700" cy="400" r="120" fill="#156d47" fill-opacity="0.05"/>
  <rect x="680" y="80" width="24" height="24" rx="6" fill="#25d366" fill-opacity="0.15" transform="rotate(25 680 80)"/>
  <polygon points="180,420 195,395 210,420" fill="#10b981" fill-opacity="0.2"/>

  <!-- Main Titles on Image -->
  <text x="320" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#1e293b" text-anchor="middle">Best WhatsApp CRM</text>
  <text x="320" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#334155" text-anchor="middle">for Small Business</text>
  
  <!-- "A Quick Guide" Pill Button -->
  <g transform="translate(235, 142)">
    <rect width="170" height="38" rx="19" fill="url(#btnGrad)"/>
    <text x="85" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A Quick Guide</text>
  </g>

  <!-- Left Side: Dashboard UI Mockup Window -->
  <g transform="translate(60, 205)" filter="url(#shadow)">
    <!-- Dashboard Frame -->
    <rect width="440" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="440" height="32" rx="16" fill="#f8fafc"/>
    <rect y="20" width="440" height="12" fill="#f8fafc"/>
    <line x1="0" y1="32" x2="440" y2="32" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="22" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="16" r="4.5" fill="#10b981"/>

    <!-- Account Quality Card -->
    <g transform="translate(20, 48)">
      <rect width="180" height="95" rx="10" fill="#f8fafc" stroke="#edf2f7"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">Account quality</text>
      <!-- Green high badge -->
      <path d="M 14 48 L 18 42 L 22 46 L 30 36" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#16a34a">High</text>
      <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Meta Verified Health</text>
    </g>

    <!-- Conversation Metrics Card -->
    <g transform="translate(220, 48)">
      <rect width="200" height="95" rx="10" fill="#f8fafc" stroke="#edf2f7"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">Conversation count (24h)</text>
      <text x="14" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#0f172a">156 <tspan font-size="12" font-weight="500" fill="#64748b">of Unlimited</tspan></text>
      <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#15803d">99.8% Delivered</text>
    </g>

    <!-- Setup Guide Progress Bar -->
    <g transform="translate(20, 160)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#334155">Setup your WABA Profile</text>
      <text x="350" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#16a34a">4 of 6 Done</text>
      <rect y="28" width="400" height="8" rx="4" fill="#e2e8f0"/>
      <rect y="28" width="280" height="8" rx="4" fill="url(#btnGrad)"/>
      <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Link your Business number to start broadcasts</text>
    </g>
  </g>

  <!-- Right Side: User Illustration & WhatsApp Icon -->
  <g transform="translate(490, 160)">
    <!-- Glow Background -->
    <circle cx="150" cy="170" r="120" fill="#25d366" fill-opacity="0.12"/>
    
    <!-- Smiling Professional Woman Portrait -->
    <defs>
      <clipPath id="circleUser">
        <circle cx="150" cy="160" r="110"/>
      </clipPath>
    </defs>
    
    <g clip-path="url(#circleUser)">
      <!-- Soft background in circle -->
      <rect x="40" y="50" width="220" height="220" fill="#d1fae5"/>
      <!-- Body & Clothes -->
      <path d="M 60 270 Q 150 200 240 270 Z" fill="#2563eb"/>
      <path d="M 110 200 Q 150 220 190 200 L 190 270 L 110 270 Z" fill="#3b82f6"/>
      <!-- Neck -->
      <rect x="135" y="160" width="30" height="35" rx="8" fill="#fbcfe8"/>
      <!-- Head -->
      <ellipse cx="150" cy="130" rx="45" ry="52" fill="#fce7f3"/>
      <!-- Hair -->
      <path d="M 95 130 C 95 65 205 65 205 130 C 215 170 195 210 185 220 C 175 180 195 130 180 100 C 150 80 125 100 115 130 C 105 180 115 210 105 220 C 95 200 95 160 95 130 Z" fill="#451a03"/>
      <!-- Smile & Features -->
      <path d="M 140 148 Q 150 156 160 148" fill="none" stroke="#9d174d" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="138" cy="128" r="3.5" fill="#1e293b"/>
      <circle cx="162" cy="128" r="3.5" fill="#1e293b"/>
      <!-- Smartphone held in hand -->
      <g transform="translate(90, 160)">
        <rect width="45" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="3" y="6" width="39" height="73" rx="5" fill="#22c55e"/>
        <circle cx="22" cy="82" r="2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Outer Border Ring -->
    <circle cx="150" cy="160" r="110" fill="none" stroke="#10b981" stroke-width="4"/>

    <!-- Floating 3D WhatsApp Badge -->
    <g transform="translate(50, 195)" filter="url(#shadow)">
      <circle cx="34" cy="34" r="32" fill="#ffffff"/>
      <circle cx="34" cy="34" r="28" fill="url(#waGreen)"/>
      <path d="M 44 38 C 43 40.5 40.5 42 38 42 C 32 42 26 36 26 30 C 26 27.5 27.5 25 30 24 C 31 23.5 32.5 24.5 33 26 L 34.5 29 C 35 29.5 34.8 30.2 34.2 30.7 L 33.2 31.5 C 34 33.2 35.5 34.7 37.2 35.5 L 38 34.5 C 38.5 33.9 39.2 33.7 39.7 34.2 L 42.7 35.7 C 44 36.3 44.5 37.5 44 38 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
