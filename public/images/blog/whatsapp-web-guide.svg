<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3faf6"/>
      <stop offset="100%" stop-color="#e6f5ee"/>
    </linearGradient>
    <linearGradient id="waGreen3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="webShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="600" height="375" rx="16" fill="url(#webBg)"/>

  <!-- Background decorative lines -->
  <circle cx="520" cy="80" r="100" fill="#25d366" fill-opacity="0.07"/>
  <circle cx="90" cy="310" r="120" fill="#10b981" fill-opacity="0.05"/>

  <!-- Top powered by text -->
  <text x="300" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b" text-anchor="middle">POWERED BY WAPINE</text>

  <!-- Left: Titles -->
  <g transform="translate(45, 120)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="900" fill="#156d47">WhatsApp Web</text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#475569">A Guide to WhatsApp Desktop</text>

    <!-- Key features bullet pills -->
    <g transform="translate(0, 90)">
      <rect width="180" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#10b981"/>
      <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Multi-Device Link 2025</text>
    </g>
    <g transform="translate(0, 126)">
      <rect width="160" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#10b981"/>
      <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Keyboard Shortcuts</text>
    </g>
  </g>

  <!-- Right: QR Code & Person Sitting with Laptop -->
  <g transform="translate(320, 60)">
    <!-- QR Code Container -->
    <g transform="translate(60, 10)" filter="url(#webShadow)">
      <!-- Target Corner Frames -->
      <path d="M 5 25 L 5 5 L 25 5" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 85 5 L 105 5 L 105 25" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 5 85 L 5 105 L 25 105" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <path d="M 85 105 L 105 105 L 105 85" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

      <!-- QR Base -->
      <rect x="12" y="12" width="86" height="86" rx="6" fill="#ffffff"/>
      <!-- QR Blocks Mockup -->
      <rect x="20" y="20" width="22" height="22" fill="#0f172a"/>
      <rect x="24" y="24" width="14" height="14" fill="#ffffff"/>
      <rect x="27" y="27" width="8" height="8" fill="#0f172a"/>

      <rect x="68" y="20" width="22" height="22" fill="#0f172a"/>
      <rect x="72" y="24" width="14" height="14" fill="#ffffff"/>
      <rect x="75" y="27" width="8" height="8" fill="#0f172a"/>

      <rect x="20" y="68" width="22" height="22" fill="#0f172a"/>
      <rect x="24" y="72" width="14" height="14" fill="#ffffff"/>
      <rect x="27" y="75" width="8" height="8" fill="#0f172a"/>

      <!-- QR pattern dots -->
      <rect x="48" y="22" width="6" height="10" fill="#0f172a"/>
      <rect x="58" y="22" width="5" height="5" fill="#0f172a"/>
      <rect x="48" y="38" width="14" height="6" fill="#0f172a"/>
      <rect x="68" y="50" width="10" height="12" fill="#0f172a"/>
      <rect x="50" y="58" width="8" height="8" fill="#0f172a"/>
      <rect x="72" y="72" width="14" height="14" fill="#0f172a"/>
    </g>

    <!-- Person Sitting with Laptop -->
    <g transform="translate(10, 120)">
      <!-- Head and Hair -->
      <circle cx="105" cy="40" r="22" fill="#fed7aa"/>
      <path d="M 85 36 C 85 18 125 18 125 36 C 128 48 125 58 120 62 C 115 48 125 32 110 24 C 95 24 90 32 85 36 Z" fill="#1e293b"/>
      <!-- Beard -->
      <path d="M 94 48 C 94 62 116 62 116 48 Z" fill="#1e293b"/>
      <!-- Body / Green Sweatshirt -->
      <path d="M 70 85 C 70 65 140 65 140 85 L 155 130 L 55 130 Z" fill="#16a34a"/>
      <!-- Crossed legs (sitting) -->
      <path d="M 50 145 C 50 125 160 125 160 145 C 160 160 50 160 50 145 Z" fill="#334155"/>
      <!-- Laptop -->
      <g transform="translate(80, 95)">
        <polygon points="10,0 45,0 55,20 0,20" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
        <rect x="12" y="-18" width="32" height="20" rx="3" fill="#475569" stroke="#334155" stroke-width="1"/>
        <circle cx="28" cy="-8" r="2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Floating WhatsApp Logo -->
    <g transform="translate(180, 150)" filter="url(#webShadow)">
      <circle cx="18" cy="18" r="16" fill="url(#waGreen3)"/>
      <path d="M 23 21 C 22.5 22.2 21 23 19.5 23 C 16.5 23 14 20.5 14 17.5 C 14 16 14.8 14.5 16 14 L 17 16 C 16.8 16.5 17 17 17.5 17.5 C 18 18 18.5 18.2 19 18 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
