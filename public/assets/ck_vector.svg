<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- C Gradient -->
    <linearGradient id="ck-grad-c" x1="12%" y1="18%" x2="88%" y2="82%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- K Gradient -->
    <linearGradient id="ck-grad-k" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Swoosh Dynamic Cyan Gradient -->
    <linearGradient id="ck-swoosh" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter for subtle depth -->
    <filter id="ck-drop-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#ck-drop-shadow)">
    <!-- Letter K (Base layer behind / intertwined) -->
    <g fill="url(#ck-grad-k)">
      <!-- Vertical Stem of K -->
      <rect x="290" y="52" width="46" height="236" rx="4" />

      <!-- Diagonal Upper Arm of K -->
      <polygon points="334,170 410,52 466,52 364,198" />

      <!-- Diagonal Lower Leg of K -->
      <polygon points="352,180 472,288 412,288 316,192" />
    </g>

    <!-- Letter C (Bold Modern Sans Form) -->
    <path
      d="M 276 96 
         C 260 72, 226 56, 186 56 
         C 112 56, 54 116, 54 190 
         C 54 264, 112 324, 186 324 
         C 230 324, 266 304, 284 278 
         L 242 248 
         C 230 264, 208 274, 184 274 
         C 138 274, 102 236, 102 190 
         C 102 144, 138 106, 184 106 
         C 206 106, 228 116, 240 130 
         Z"
      fill="url(#ck-grad-c)"
    />

    <!-- Dynamic Speed Swoosh Arc cutting through C and K -->
    <path
      d="M 18 140 
         C 110 134, 190 120, 260 148 
         C 320 172, 350 216, 358 276 
         C 350 252, 328 206, 268 184 
         C 200 160, 110 164, 18 140 
         Z"
      fill="url(#ck-swoosh)"
    />

    <!-- Cyan Highlight Accent on Lower Swoosh -->
    <path
      d="M 230 160 
         C 290 180, 340 220, 350 286 
         C 356 264, 344 216, 290 182 
         C 270 170, 248 164, 230 160 
         Z"
      fill="#38bdf8"
      opacity="0.9"
    />
  </g>
</svg>
